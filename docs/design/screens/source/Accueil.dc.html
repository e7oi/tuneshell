<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil — onglet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; background: {{t.surface}}; color: {{t.onSurface}}; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: {{rootDir}}; overflow: hidden">

  <sc-if value="{{land}}" hint-placeholder-val="{{ false }}">
    <div style="width: 80px; flex-shrink: 0; background: {{t.surface}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 0">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <div style="width: 80px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{n.color}}">
          <span style="width: 56px; height: 28px; border-radius: 14px; background: {{n.pill}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg></span>
          <span style="font-size: 11px; line-height: 14px; font-weight: {{n.weight}}">{{n.label}}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden">

    <div style="flex-shrink: 0; display: flex; align-items: center; padding: 8px 8px 0 16px; height: 56px; box-sizing: border-box">
      <h1 style="margin: 0; flex: 1; font-family: Manrope, sans-serif; font-size: 28px; line-height: 36px; font-weight: 800">Accueil</h1>
      <sc-if value="{{showShuffle}}" hint-placeholder-val="{{ true }}">
        <button aria-label="Autres suggestions" style="height: 48px; padding: 0 16px 0 12px; border-radius: 24px; background: {{t.secCont}}; color: {{t.onSecCont}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></svg>Autres suggestions</button>
      </sc-if>
    </div>

    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <div style="margin: 8px 16px 0; border-radius: 12px; background: {{t.surfContHigh}}; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 56px; box-sizing: border-box; justify-content: center">
        <span style="font-size: 14px; line-height: 20px">Lecture de la bibliothèque…</span>
        <div style="height: 4px; border-radius: 2px; background: {{t.outlineVar}}; overflow: hidden"><div style="width: 38%; height: 4px; border-radius: 2px; background: {{t.primary}}; margin-left: 24%"></div></div>
      </div>
    </sc-if>

    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 32px; text-align: center">
        <div style="width: 96px; height: 96px; border-radius: 28px; background: {{t.surfContHigh}}; display: flex; align-items: center; justify-content: center; color: {{t.onSurfVar}}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></svg></div>
        <h2 style="margin: 0; font-family: Manrope, sans-serif; font-size: 22px; line-height: 28px; font-weight: 700">Rien à afficher pour l'instant</h2>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: {{t.onSurfVar}}">Lance une piste, elle reviendra ici.</p>
      </div>
    </sc-if>

    <sc-if value="{{showBody}}" hint-placeholder-val="{{ true }}">
      <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: {{bodyDir}}; gap: 16px">

        <sc-if value="{{hasTracks}}" hint-placeholder-val="{{ true }}">
          <section aria-label="Pistes oubliées" style="width: {{heroW}}; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px">
            <h2 style="margin: 8px 0 0; font-family: Manrope, sans-serif; font-size: 18px; line-height: 24px; font-weight: 700; min-height: 32px; display: flex; align-items: center">Pistes oubliées</h2>
            <sc-for list="{{tracks}}" as="r" hint-placeholder-count="3">
              <a href="#piste" aria-label="{{r.label}}" style="height: 64px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; opacity: {{r.op}}">
                <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 8px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
                  <sc-if value="{{r.hasCover}}" hint-placeholder-val="{{ true }}"><div style="width: 30px; height: 30px; border-radius: 50%; background: {{r.fg}}; transform: translate(6px, 8px)"></div></sc-if>
                  <sc-if value="{{r.noCover}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.onSurfVar}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></svg></sc-if>
                </div>
                <div style="min-width: 0; flex: 1; display: flex; flex-direction: column">
                  <span style="font-size: 16px; line-height: 24px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</span>
                  <span style="font-size: 14px; line-height: 20px; color: {{t.onSurfVar}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sub}}</span>
                </div>
                <sc-if value="{{r.present}}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; line-height: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: {{t.onSurfVar}}">{{r.dur}}</span></sc-if>
              </a>
            </sc-for>
          </section>
        </sc-if>

        <sc-if value="{{hasGrid}}" hint-placeholder-val="{{ true }}">
          <section aria-label="Albums oubliés" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 32px">
              <h2 style="margin: 0; flex: 1; font-family: Manrope, sans-serif; font-size: 18px; line-height: 24px; font-weight: 700">Albums oubliés</h2>
              
            </div>
            <div style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 16px 16px; align-content: start">
              <sc-for list="{{albums}}" as="a" hint-placeholder-count="4">
                <a href="#album" aria-label="{{a.label}}" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; opacity: {{a.op}}">
                  <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; background: {{a.bg}}; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative">
                    <div style="width: 62%; height: 62%; border-radius: {{a.r}}; background: {{a.fg}}; transform: {{a.tr}}"></div>
                  </div>
                  <div style="display: flex; flex-direction: column; min-width: 0">
                    <span style="font-size: 14px; line-height: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.title}}</span>
                    <span style="font-size: 12px; line-height: 16px; color: {{t.onSurfVar}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.sub}}</span>
                  </div>
                </a>
              </sc-for>
            </div>
          </section>
        </sc-if>

      </div>
    </sc-if>

    <sc-if value="{{showMini}}" hint-placeholder-val="{{ true }}">
      <div style="flex-shrink: 0; margin: 8px 8px 8px; height: 64px; border-radius: 16px; background: {{t.surfContHigh}}; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; position: relative; overflow: hidden; opacity: {{hero.op}}">
        <div style="flex: 1; min-width: 0; height: 64px; display: flex; align-items: center; gap: 12px">
          <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 8px; background: {{hero.bg}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
            <sc-if value="{{hero.hasCover}}" hint-placeholder-val="{{ true }}"><div style="width: 30px; height: 30px; border-radius: 50%; background: #E8C77E; transform: translate(6px, 8px)"></div></sc-if>
            <sc-if value="{{hero.noCover}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.onSurfVar}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></svg></sc-if>
          </div>
          <div style="min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{hero.title}}</span>
            <span style="font-size: 12px; line-height: 16px; color: {{t.onSurfVar}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{hero.miniSub}}</span>
          </div>
        </div>
        <button aria-label="{{hero.btn}}" style="width: 48px; height: 48px; border-radius: 24px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{hero.isPlay}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.9l10-6.4a1 1 0 0 0 0-1.7l-10-6.4A1 1 0 0 0 8 5.6z"/></svg></sc-if>
          <sc-if value="{{hero.isPause}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></sc-if>
        </button>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: {{t.outlineVar}}"><div style="width: 34%; height: 2px; background: {{t.primary}}"></div></div>
      </div>
    </sc-if>

    <sc-if value="{{showNav}}" hint-placeholder-val="{{ true }}">
      <div style="flex-shrink: 0; height: 80px; background: {{t.surfContLow}}; display: flex; align-items: center; justify-content: space-around; padding: 0 4px">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
          <div style="width: 72px; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{n.color}}">
            <span style="width: 64px; height: 32px; border-radius: 16px; background: {{n.pill}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg></span>
            <span style="font-size: 12px; line-height: 16px; font-weight: {{n.weight}}">{{n.label}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["normal","lecture","sanspochette","petite","sanscarte","vide","chargement","paysage"],"default":"normal"},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const state = this.props.state ?? 'normal';
    const t = dark ? {
      surface: '#0F1522', onSurface: '#DEE3EA', onSurfVar: '#BCC6D2', primary: '#6FE3D0', onPrimary: '#00382F',
      surfContLow: '#161D2A', surfContHigh: '#252D3A', secCont: '#24464A', onSecCont: '#CCE8E2', outlineVar: '#3B4555'
    } : {
      surface: '#F5FAFA', onSurface: '#171D1E', onSurfVar: '#3F4949', primary: '#00695C', onPrimary: '#FFFFFF',
      surfContLow: '#EFF5F5', surfContHigh: '#E3E9E9', secCont: '#CCE8E2', onSecCont: '#051F1C', outlineVar: '#BEC8C9'
    };
    const land = state === 'paysage';
    const loading = state === 'chargement';
    const empty = state === 'vide';
    const noPlayer = state === 'sanscarte' || empty || loading;
    const noGrid = empty || loading;
    const noTracks = empty || loading;
    const playing = state === 'lecture';

    const all = [
      { title: 'Courants froids', sub: 'Hélène Marchand · 2021', bg: '#3E6B73', fg: '#E8C77E', r: '50%', tr: 'translate(20px, 26px)' },
      { title: 'Nuit blanche', sub: 'Atelier Sorel · 2017', bg: '#6B3E5E', fg: '#F2BF6B', r: '12px', tr: 'translate(-14px, 18px)' },
      { title: 'Sels et cuivre', sub: 'Mara Vidal · 2019', bg: '#4B5D3A', fg: '#D9E4B0', r: '50%', tr: 'translate(-18px, -10px)' },
      { title: 'Paysages courts', sub: 'Trio Kessler · 2012', bg: '#5A4A7C', fg: '#C9B8F0', r: '14px', tr: 'translate(16px, -14px)' },
      { title: 'Marée basse', sub: 'Hélène Marchand · 2016', bg: '#7A4E3A', fg: '#F0D2B0', r: '50%', tr: 'translate(10px, 20px)' },
      { title: 'Fenêtres ouvertes', sub: 'Omar Delacroix · 2023', bg: '#2F5D8A', fg: '#BFD9F2', r: '10px', tr: 'translate(-12px, 12px)' }
    ].map((a, i) => ({ ...a, op: 1, label: 'Album ' + a.title + ', de ' + a.sub.split(' · ')[0] }));
    const albums = all.slice(0, state === 'petite' ? 1 : 2);
    const cols = 2;

    const hero = {
      title: 'Brume sur le quai', bg: '#3E6B73', hasCover: true, noCover: false, op: 1,
      isPlay: !playing, isPause: playing, btn: playing ? 'Pause' : 'Lecture',
      miniSub: 'Hélène Marchand'
    };
    const mk = (title, sub, dur, bg, fg) => ({ title, sub, dur, bg, fg, op: 1, hasCover: true, noCover: false, present: true, label: title + ', ' + sub + ', ' + dur });
    let tracks = [
      mk('Cuivre', 'Mara Vidal · Sels et cuivre', '3:48', '#4B5D3A', '#D9E4B0'),
      mk('Les fenêtres', 'Omar Delacroix · Fenêtres ouvertes', '5:02', '#2F5D8A', '#BFD9F2'),
      mk('Veilleuse', 'Atelier Sorel · Nuit blanche', '4:21', '#6B3E5E', '#F2BF6B')
    ];
    if (state === 'sanspochette') {
      hero.title = 'Piste 03 — enregistrement.flac'; hero.bg = t.surfContLow; hero.hasCover = false; hero.noCover = true; hero.miniSub = 'Artiste inconnu';
      tracks[0] = { ...mk('Piste 03 — enregistrement.flac', 'Artiste inconnu', '2:55', t.surfContLow, '#000'), hasCover: false, noCover: true };
    }
    if (state === 'petite') tracks = tracks.slice(0, 2);

    const items = [
      { label: 'Accueil', d: 'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10' },
      { label: 'Pistes', d: 'M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z' },
      { label: 'Albums', d: 'M4 4h16v16H4zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z' },
      { label: 'Artistes', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.5-6 8-6s8 2 8 6' },
      { label: 'Réglages', d: 'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4' }
    ];
    const nav = items.map((n, i) => ({
      ...n,
      color: i === 0 ? t.onSurface : t.onSurfVar,
      pill: i === 0 ? t.secCont : 'transparent',
      weight: i === 0 ? 600 : 500
    }));

    return {
      t, nav, albums, tracks, cols, hero, land, loading, empty,
      w: land ? 915 : 412, h: land ? 412 : 915,
      rootDir: land ? 'row' : 'column',
      bodyDir: land ? 'row' : 'column',
      heroW: land ? '340px' : 'auto',
      showBody: !loading && !empty,
      hasTracks: !noTracks,
      hasGrid: !noGrid,
      showShuffle: !loading && !empty,
      showMini: !land && !noPlayer,
      showNav: !land
    };
  }
}
</script>
</body>
</html>
